[workspace]

[package]
name = "stellar-mcp-server-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.81.0"
description = "MCP Server generator for Stellar/Soroban smart contracts"
license = "Apache-2.0"
repository = "https://github.com/stellar/stellar-cli"
authors = ["Stellar Development Foundation <stellar-cli@stellar.org>"]
keywords = ["stellar", "soroban", "mcp", "smart-contracts", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "stellar-mcp-server"
path = "src/bin/main.rs"

[dependencies]
# CLI and argument parsing
clap = { version = "4.1.8", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["full"] }

# Stellar ecosystem crates
stellar-xdr = "=22.1.0"
soroban-spec-tools = "22.6.0"
soroban-spec = "=22.0.4"

# File and template handling
rust-embed = "8.0"
thiserror = "1.0.46"
serde = "1.0.82"
serde_json = "1.0.82"

# Utility crates
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.0"